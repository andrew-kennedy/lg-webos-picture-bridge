# Add this keyed script to scripts.yaml, or paste its body into the UI YAML editor.
lg_tv_mqtt_cec_policy:
  alias: LG TV MQTT CEC Policy
  description: >-
    Replace the bridge's generic CEC policy, or send only enabled to change the
    master switch. Wait for a correlated result. Unsupported actions fail without
    changing the existing policy. Requires mqtt.cec_commands_enabled on the bridge.
  mode: queued
  max: 10
  fields:
    policy:
      name: CEC policy
      required: true
      selector:
        object: {}
    command_entity:
      name: Discovered CEC status sensor
      default: sensor.lg_tv_cec_filter
      selector:
        entity:
          domain: sensor
  sequence:
    - variables:
        reply_entity: "{{ command_entity | default('sensor.lg_tv_cec_filter', true) }}"
        policy_object: "{{ policy | from_json if policy is string else policy }}"
    - wait_template: >-
        {{ states(reply_entity) not in ['unknown', 'unavailable']
           and state_attr(reply_entity, 'ready') == true
           and state_attr(reply_entity, 'session_id') is string
           and state_attr(reply_entity, 'command_topic') is string }}
      timeout: "00:00:10"
      continue_on_timeout: true
    - if: "{{ not wait.completed }}"
      then:
        - stop: MQTT CEC endpoint is unavailable; nothing sent
          error: true
    - variables:
        request_id: "ha-cec-{{ (as_timestamp(now()) * 1000000) | int }}-{{ range(10000) | random }}"
        command_session: "{{ state_attr(reply_entity, 'session_id') }}"
        command_topic: "{{ state_attr(reply_entity, 'command_topic') }}"
    - variables:
        command_payload: >-
          {{ {'protocol': 1, 'request_id': request_id, 'session_id': command_session,
              'expires_at': as_timestamp(now()) + 30, 'policy': policy_object} | to_json }}
    - repeat:
        count: 3
        sequence:
          - if: >-
              {{ request_id not in (state_attr(reply_entity, 'results') or {})
                 and state_attr(reply_entity, 'session_id') == command_session
                 and state_attr(reply_entity, 'ready') == true
                 and states(reply_entity) not in ['unknown', 'unavailable'] }}
            then:
              - action: mqtt.publish
                data:
                  topic: "{{ command_topic }}"
                  payload: "{{ command_payload }}"
                  qos: 0
                  retain: false
              - wait_template: >-
                  {{ request_id in (state_attr(reply_entity, 'results') or {})
                     or state_attr(reply_entity, 'session_id') != command_session
                     or states(reply_entity) in ['unknown', 'unavailable'] }}
                timeout: "00:00:10"
                continue_on_timeout: true
    - variables:
        command_result: >-
          {{ (state_attr(reply_entity, 'results') or {}).get(request_id, {})
             if state_attr(reply_entity, 'session_id') == command_session else {} }}
    - if: "{{ not command_result }}"
      then:
        - stop: >-
            No confirmed CEC result for {{ request_id }}. Inspect the CEC status
            sensor before retrying; the command may have applied before disconnect.
          error: true
    - if: "{{ command_result.get('ok') != true }}"
      then:
        - stop: >-
            CEC policy failed: {{ command_result.get('error', 'unknown') }}:
            {{ command_result.get('message', 'No details') }}
          error: true
    - stop: CEC policy confirmed by LG bridge
      response_variable: command_result
