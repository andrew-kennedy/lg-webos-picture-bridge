alias: Pair LG Picture Bridge MQTT
description: >-
  MQTT discovery setup. Store credentials in secrets.yaml. This replaces the
  webhook transport but preserves the existing picture-policy command token.
sequence:
  - action: webostv.command
    data:
      entity_id: media_player.lg_webos_smart_tv
      command: system.launcher/launch
      payload:
        id: io.github.andrewkennedy.lgpicturebridge
        params:
          setup:
            transport: mqtt
            device_id: living-room-lg-c9
            device_name: Living Room LG TV
            command_token: !secret lg_picture_bridge_command_token_raw
            mqtt:
              host: 10.0.0.4
              port: 1883
              username: !secret lg_picture_bridge_mqtt_username
              password: !secret lg_picture_bridge_mqtt_password
              discovery_prefix: homeassistant
              topic_prefix: lg_picture_bridge
mode: single
