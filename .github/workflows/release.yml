name: Release and Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout
      - run: npm run validate
      - run: npm run build
      - run: npm run manifest
      - run: npm run site
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/*.ipk dist/*.manifest.json site/apps.json --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/*.ipk dist/*.manifest.json site/apps.json \
              --verify-tag \
              --generate-notes \
              --title "LG Picture Bridge $RELEASE_TAG"
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Publish install feed to main
        run: |
          feed_copy="${RUNNER_TEMP}/lg-picture-bridge-apps.json"
          cp site/apps.json "$feed_copy"
          # The generated feed is safely copied above. Clear just this generated
          # tracked file so a newer feed on main cannot block the checkout.
          git restore --source=HEAD -- site/apps.json
          git fetch origin main
          git checkout -B main FETCH_HEAD
          cp "$feed_copy" site/apps.json
          if git diff --quiet -- site/apps.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/apps.json
          git commit -m "Update Homebrew feed for ${RELEASE_TAG} [skip ci]"
          git push origin main
