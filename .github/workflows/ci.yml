name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - run: npm run manifest
      - run: npm run site
      - uses: actions/upload-artifact@v4
        with:
          name: lg-picture-bridge-ipk
          path: |
            dist/*.ipk
            dist/*.manifest.json
